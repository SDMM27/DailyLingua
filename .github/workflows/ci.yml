# Continuous integration (phase 7): static checks and build, then database tests and end-to-end tests.
# Private repository: the minutes are metered, hence two parallel jobs, a cancelled run when a newer
# commit arrives, and nothing that is not needed (no Studio, storage, realtime… in the local stack).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Typecheck + lint + unit tests. The integration tests skip themselves without a database
      # (they run in the `database` job).
      - run: npm run check
      # No Supabase variable: the build is the public demo, which is what we want to verify here.
      - run: npm run build

  database:
    name: Database (pgTAP, integration, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The CLI of the devDependencies (same version as local development). Only what the app needs:
      # Postgres, Auth (gotrue), PostgREST and the API gateway (kong).
      - name: Start the local Supabase stack
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit,realtime,storage-api
      - name: Reset the database (migrations + seed)
        run: npx supabase db reset
      - name: pgTAP tests
        run: npx supabase test db

      - name: Export the local Supabase variables
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          read_var() { sed -n "s/^$1=\"\(.*\)\"$/\1/p" "$RUNNER_TEMP/supabase.env"; }
          API_URL="$(read_var API_URL)"
          ANON_KEY="$(read_var ANON_KEY)"
          SERVICE_ROLE_KEY="$(read_var SERVICE_ROLE_KEY)"
          for value in "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY"; do
            test -n "$value" || { echo "Variable manquante dans 'supabase status -o env'" >&2; exit 1; }
          done
          # Local keys, but masked all the same.
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/supabase.env"

      # Now that the variables are set, the integration tests run instead of skipping.
      - name: Tests (with the database)
        run: npm test

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Browsers come from the cache when present; the system libraries are always installed.
      - run: npx playwright install --with-deps webkit
      - name: End-to-end tests
        run: npm run e2e
        env:
          CI: "true"
          MISSION_GENERATOR: template # no paid AI call
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
